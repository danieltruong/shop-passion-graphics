<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&amp;family=Anton&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header style="font-family: Tahoma, Verdana, 'Segoe UI', sans-serif; color: #ffffff; background: linear-gradient(180deg, rgba(20,0,40,0.95) 0%, rgba(13,13,26,0.92) 100%); border-bottom: 4px ridge #c0c0c0">
<div style="background: #000; border-bottom: 2px solid #ffd700; overflow: hidden; white-space: nowrap; padding: 7px 0; text-align: center; font-family: 'Comic Sans MS', 'Comic Neue', cursive; font-size: 15px; font-weight: 700; color: #39ff14; letter-spacing: 1px">★ HANDMADE IN SMALL BATCHES ★ SHIPS IN 3–5 BUSINESS DAYS ★ FREE SHIPPING IN CANADA OVER $[XX] ★ SECURE CHECKOUT BY STRIPE ★</div>
<div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
<svg width="40" height="35" viewBox="0 0 64 56" aria-hidden="true"><circle cx="18" cy="16" r="12" fill="#39c25a"/><circle cx="46" cy="16" r="12" fill="#39c25a"/><ellipse cx="32" cy="36" rx="28" ry="18" fill="#39c25a"/><circle cx="18" cy="16" r="6" fill="#fff"/><circle cx="46" cy="16" r="6" fill="#fff"/><circle cx="19" cy="17" r="3" fill="#111"/><circle cx="47" cy="17" r="3" fill="#111"/><path d="M18 38 Q32 48 46 38" stroke="#14532d" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
<span style="font-family: Papyrus, 'Segoe Print', fantasy; font-size: 28px; font-weight: 700; background: linear-gradient(90deg,#ff5c5c,#ff9a1f,#ffd700,#39ff14,#00bfff,#b98cff,#ff69b4); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent">shop.passion.graphics</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px 22px; flex: 1 1 auto">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<a href="{{n.href}}" aria-current="{{n.current}}" style="{{n.style}}">{{n.label}}</a>
</sc-for>
</nav>
<div style="display: flex; align-items: center; gap: 10px">
<label for="site-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search products</label>
<div style="display: flex; align-items: center; gap: 6px; background: #fff; border: 2px solid; border-color: #404040 #ffffff #ffffff #404040; padding: 0 8px; min-height: 40px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input id="site-search" type="search" placeholder="Search products" style="border: 0; outline: none; width: 170px; font: 14px Tahoma, Verdana, sans-serif; color: #000; background: transparent">
</div>
<a href="Cart.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; font-family: Impact, Anton, sans-serif; font-size: 18px; letter-spacing: 1px; color: #000; text-decoration: none; background: linear-gradient(180deg, #ffff66 0%, #ffb11a 55%, #ff6a00 100%); border: 3px outset #ffd700; box-shadow: 3px 3px 0 rgba(0,0,0,0.5)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h3l2.5 12h11L21 7H6.5"/><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/></svg>
CART ({{cartCount}})</a>
</div>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["shop","about","faq","shipping","none"],"default":"shop"},"cartCount":{"editor":"int","default":2,"min":0,"max":99},"$preview":{"width":1280,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'shop';
    const base = 'display: inline-flex; align-items: center; min-height: 44px; font-size: 16px; font-weight: 700; text-decoration: none; ';
    const items = [
      { key: 'shop', label: 'Shop', href: 'Main.dc.html' },
      { key: 'about', label: 'About', href: 'About.dc.html' },
      { key: 'faq', label: 'FAQ', href: 'FAQ.dc.html' },
      { key: 'shipping', label: 'Shipping & returns', href: 'Shipping.dc.html' }
    ];
    const nav = items.map((i) => ({
      ...i,
      current: i.key === active ? 'page' : 'false',
      style: base + (i.key === active
        ? 'color: #ffd700; text-decoration: underline wavy #ffd700; text-underline-offset: 6px;'
        : 'color: #e6e6ff;')
    }));
    return { nav, cartCount: this.props.cartCount ?? 2 };
  }
}
</script>
</body>
</html>
