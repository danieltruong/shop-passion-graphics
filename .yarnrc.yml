# Yarn 4.
#
# The release is vendored in .yarn/releases and pointed at by `yarnPath` below. That is
# deliberate and not redundant with `packageManager` in package.json: corepack alone means a
# stale global yarn (1.22 from an `npm i -g yarn`) fails with
#   "This project's package.json defines packageManager yarn@4.18.0, however the current
#    global version of Yarn is 1.22.22"
# With yarnPath set, *any* yarn on PATH delegates to the vendored 4.18.0 — including Yarn 1,
# and including Node versions that no longer ship corepack at all.
yarnPath: .yarn/releases/yarn-4.18.0.cjs

# node-modules, not Plug'n'Play. PnP is Yarn's default and is the faster linker, but it breaks
# tools that resolve files by walking the filesystem rather than through Node's resolver —
# vite's plugin/optimizer paths, netlify-cli, and playwright's browser download all assume a
# real node_modules tree. Switching this to `pnp` means auditing every one of those.
nodeLinker: node-modules

# Each workspace keeps its own node_modules instead of hoisting everything to the root.
# Required by the Lambda: infra/template.yaml builds lambda/create-checkout through a Makefile
# that copies that directory's node_modules into the deployment artifact, so its dependencies
# must physically live there rather than being hoisted out of reach.
nmHoistingLimits: workspaces

# Do not keep the package cache in the repo (no zero-installs). CI restores it through
# actions/setup-node's `cache: yarn`.
enableGlobalCache: true

# Corrections to third-party package metadata. This fixes a broken peer-dependency declaration
# *inside netlify-cli's tree* — nothing here touches this project's own code, and without it
# `yarn install` ends in "Done with warnings" on every run.
#
# Prefer this over silencing YN0086 with logFilters: a discarded warning also hides the next,
# real one. Recheck on netlify-cli upgrades — when upstream fixes it, delete the entry.
#
# (The companion @opentelemetry/api mismatch is handled by `resolutions` in package.json
# instead. packageExtensions can only *add* metadata, never widen a range the package already
# declares, so an extension there is silently ignored — yarn says so with YN0069.)
packageExtensions:
  # ts-node lists @types/node as a required peer, but it is a types-only, compile-time
  # dependency; nothing in netlify's runtime path needs it present. Marking it optional is
  # accurate and adds nothing to the install.
  'ts-node@*':
    peerDependenciesMeta:
      '@types/node':
        optional: true
