# Not redundant with `packageManager`: any yarn on PATH (Yarn 1 too) delegates to this release,
# so a stale global yarn cannot fail the install. See CLAUDE.md "Package manager".
yarnPath: .yarn/releases/yarn-4.18.0.cjs

# Not PnP: vite, netlify-cli and playwright resolve files by walking a real node_modules tree.
nodeLinker: node-modules

# The Lambda Makefile copies lambda/create-checkout/node_modules, so its deps must not hoist.
nmHoistingLimits: workspaces

# No zero-installs; CI restores the cache through actions/setup-node `cache: yarn`.
enableGlobalCache: true

# ts-node (inside netlify-cli) wrongly requires @types/node; without this every install warns.
# Delete when upstream fixes it; logFilters would also hide the next real warning.
packageExtensions:
  'ts-node@*':
    peerDependenciesMeta:
      '@types/node':
        optional: true
