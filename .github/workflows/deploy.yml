name: Deploy

on:
  # Staging deploys on every push to main
  push:
    branches: [main]
  # Production deploys manually
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, prod]
        default: staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ca-central-1

jobs:
  # CI runs first so a commit that fails lint or tests never deploys.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy → ${{ inputs.environment || 'staging' }}
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    permissions:
      contents: read
      # Required for OIDC.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Must precede setup-node — `cache: 'yarn'` invokes yarn to find the cache folder.
      # Yarn's version comes from `packageManager` in package.json.
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      # Fail early rather than part-way through a deploy. ALLOWED_ORIGIN is not a secret:
      # the template derives it from the CloudFront distribution it creates.
      - name: Verify required secrets
        env:
          STRIPE_SECRET_ARN: ${{ secrets.STRIPE_SECRET_ARN }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          missing=0
          for var in STRIPE_SECRET_ARN S3_BUCKET_NAME; do
            if [ -z "${!var}" ]; then
              echo "❌ Required secret $var is not set"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "✅ Required secrets present"

      # AWS credentials must come before SAM deploy so the Lambda and API Gateway stack are
      # created/updated before the Vite build runs. The API Gateway URL is captured from the
      # stack output and injected into the bundle as VITE_CHECKOUT_API_URL.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.0.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The checkout function validates every submitted price ID against this catalog, so it
      # must be inside the function bundle before `sam build` packages CodeUri.
      - name: Sync catalog into Lambda bundle
        run: yarn sync:catalog

      # SAM is pre-installed on ubuntu-latest runners.
      #
      # `sam build` uses the makefile builder (Metadata: BuildMethod: makefile in the template)
      # rather than SAM's native Node.js builder, which would run `npm install`. The Makefile
      # copies the node_modules that `yarn install --immutable` above already produced in the
      # workspace — so that install step is a build dependency of this one, not just a test one.
      #
      # No `continue-on-error`: a failed API deploy must fail the job, or the build ships an
      # empty VITE_CHECKOUT_API_URL and a broken checkout button.
      - name: Deploy Checkout API (SAM)
        id: sam
        run: |
          set -euo pipefail
          ENV=${{ inputs.environment || 'staging' }}
          sam build --template-file infra/template.yaml

          PARAM_OVERRIDES=(
            "Stage=${ENV}"
            "StripeSecretArn=${{ secrets.STRIPE_SECRET_ARN }}"
            # The stack does not create the site bucket, but it owns the bucket policy that
            # restricts reads to the CloudFront distribution.
            "SiteBucketName=${{ secrets.S3_BUCKET_NAME }}"
          )

          # Optional, and normally unset: CloudFront's own domain is always allowed by the
          # template. This is only for a custom domain in front of the same distribution.
          # Omitted rather than passed empty so the template default applies cleanly.
          CUSTOM_DOMAIN_ORIGINS="${{ secrets.CUSTOM_DOMAIN_ORIGINS }}"
          if [ -n "$CUSTOM_DOMAIN_ORIGINS" ]; then
            PARAM_OVERRIDES+=("CustomDomainOrigins=${CUSTOM_DOMAIN_ORIGINS}")
          fi

          sam deploy \
            --config-file infra/samconfig.toml \
            --config-env "${ENV}" \
            --parameter-overrides "${PARAM_OVERRIDES[@]}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

          stack_output() {
            aws cloudformation describe-stacks \
              --stack-name "shop-passion-${ENV}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text \
              --region ${{ env.AWS_REGION }}
          }

          CHECKOUT_URL=$(stack_output ApiUrl)
          SITE_URL=$(stack_output SiteUrl)
          DISTRIBUTION_ID=$(stack_output DistributionId)

          # `--output text` prints the literal string "None" when the output is absent, which
          # would otherwise be baked into the bundle as VITE_CHECKOUT_API_URL="None" — or, for
          # the distribution, make the invalidation step target nothing while still passing.
          for pair in "ApiUrl=${CHECKOUT_URL}" "SiteUrl=${SITE_URL}" "DistributionId=${DISTRIBUTION_ID}"; do
            key=${pair%%=*}
            value=${pair#*=}
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "❌ Stack produced no ${key} output — refusing to continue"
              exit 1
            fi
          done

          {
            echo "checkout_url=${CHECKOUT_URL}"
            echo "site_url=${SITE_URL}"
            echo "distribution_id=${DISTRIBUTION_ID}"
          } >> "$GITHUB_OUTPUT"
          echo "✅ SAM deploy complete — API ${CHECKOUT_URL}, site ${SITE_URL}"

      - name: Build
        run: yarn build
        env:
          NODE_ENV: production
          # Stack output only: a secret fallback could be empty, which CartDrawer's `??` misses.
          VITE_CHECKOUT_API_URL: ${{ steps.sam.outputs.checkout_url }}

      - name: Deploy to S3
        run: |
          set -euo pipefail

          # Hashed assets — long-lived cache (Vite content-hashes filenames)
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "products.json"

          # Entry point + data — no cache
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"

          # No `|| true`: it would hide a failed upload, so the catalog could silently not publish.
          aws s3 cp dist/products.json \
            s3://${{ secrets.S3_BUCKET_NAME }}/products.json \
            --cache-control "public, max-age=0, must-revalidate"

          echo "✅ S3 sync complete"

      # Distribution ID comes from the stack, not a secret, so this step cannot be skipped
      # and leave a stale index.html behind a green job.
      - name: Invalidate CloudFront cache
        run: |
          set -euo pipefail
          # "/" as well as "/index.html": DefaultRootObject serves index.html at the root, but
          # CloudFront caches that under the "/" key, so invalidating only "/index.html" leaves
          # the landing page stale.
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.sam.outputs.distribution_id }}" \
            --paths "/" "/index.html" "/products.json"
          echo "✅ CloudFront invalidation queued"

      - name: Print deployment URL
        run: |
          echo "🚀 Deployed to: ${{ steps.sam.outputs.site_url }}"
