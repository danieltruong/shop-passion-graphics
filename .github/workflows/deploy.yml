name: Deploy

on:
  # Staging auto-deploys on every push to develop
  push:
    branches: [develop]
  # Production deploys manually
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, prod]
        default: staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ca-central-1

jobs:
  deploy:
    name: Deploy → ${{ inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # AWS credentials must come before SAM deploy so the Lambda and API
      # Gateway stack are created/updated before the Vite build runs.
      # The API Gateway URL is captured from the stack output and injected
      # into the bundle as VITE_CHECKOUT_API_URL — no manual secret needed.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.0.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # SAM is pre-installed on ubuntu-latest runners.
      # sam build: installs Lambda deps + packages source into .aws-sam/build/
      # sam deploy: creates or updates the CloudFormation stack (idempotent).
      # --resolve-s3 auto-creates a managed S3 bucket for SAM artifacts.
      - name: Deploy Checkout API (SAM)
        id: sam
        continue-on-error: true  # SAM needs extra IAM perms; products+site still deploy if this fails
        run: |
          ENV=${{ inputs.environment || 'staging' }}
          sam build --template-file infra/template.yaml
          sam deploy \
            --config-file infra/samconfig.toml \
            --config-env "${ENV}" \
            --parameter-overrides \
              "Stage=${ENV}" \
              "StripeSecretKey=${{ secrets.STRIPE_SECRET_KEY }}" \
              "AllowedOrigin=${{ secrets.ALLOWED_ORIGIN || '*' }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

          CHECKOUT_URL=$(aws cloudformation describe-stacks \
            --stack-name shop-passion-${ENV} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "checkout_url=${CHECKOUT_URL}" >> "$GITHUB_OUTPUT"
          echo "✅ SAM deploy complete — ${CHECKOUT_URL}"

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # SAM stack output takes priority; falls back to a manually set secret
          # while IAM permissions are being provisioned for the Lambda deploy.
          VITE_CHECKOUT_API_URL: ${{ steps.sam.outputs.checkout_url || secrets.VITE_CHECKOUT_API_URL }}

      - name: Deploy to S3
        run: |
          # Hashed assets — long-lived cache (Vite content-hashes filenames)
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "products.json"

          # Entry point + data — no cache
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"
          [ -f dist/products.json ] && aws s3 cp dist/products.json \
            s3://${{ secrets.S3_BUCKET_NAME }}/products.json \
            --cache-control "public, max-age=0, must-revalidate" || true

          echo "✅ S3 sync complete"

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
              --paths "/index.html" "/products.json"
            echo "✅ CloudFront invalidation queued"
          else
            echo "ℹ️  No CloudFront configured — skipping"
          fi

      - name: Print deployment URL
        env:
          CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
        run: |
          if [ -n "$CLOUDFRONT_DOMAIN" ]; then
            echo "🚀 Deployed to: https://$CLOUDFRONT_DOMAIN"
          else
            echo "🚀 Deployed to: http://${{ secrets.S3_BUCKET_NAME }}.s3-website.${{ env.AWS_REGION }}.amazonaws.com"
          fi
