name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  # Called by deploy.yml, which also covers pushes to develop; listing develop
  # under push too would start a second run in the same concurrency group.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Must run before setup-node: `cache: 'yarn'` calls yarn to locate the cache folder,
      # so yarn has to resolve on PATH first.
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'yarn'

      # --immutable fails instead of rewriting yarn.lock, so an uncommitted lockfile
      # change cannot pass CI.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test:run

      # No STRIPE_SECRET_KEY: the build does not need it, and a pull_request build could
      # exfiltrate it through a workflow or build-script change.
      - name: Build
        run: yarn build
        env:
          # Intentionally empty: CartDrawer falls back to the local Netlify function URL and
          # the build succeeds. The real URL is injected only by deploy.yml.
          VITE_CHECKOUT_API_URL: ''

      - name: Verify build output
        run: |
          test -f dist/index.html   || (echo "❌ dist/index.html missing" && exit 1)
          test -f dist/products.json || (echo "❌ dist/products.json missing" && exit 1)
          echo "✅ Build OK — $(du -sh dist/ | cut -f1)"

      # jsdom cannot test focus management, computed styles or prefers-reduced-motion;
      # these browser tests do. They reuse the dist/ built above via `vite preview`.
      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: End-to-end tests
        run: yarn test:e2e
        env:
          VITE_CHECKOUT_API_URL: ''

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
