AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Shop Passion Graphics — Checkout API (Lambda + HTTP API Gateway)

# ─────────────────────────────────────────────
# Parameters — supplied at deploy time via
#   sam deploy --parameter-overrides ...
# ─────────────────────────────────────────────
Parameters:
  Stage:
    Type: String
    AllowedValues: [staging, prod]
    Default: staging
    Description: Deployment stage — matches GitHub environment name.

  StripeSecretArn:
    Type: String
    # Must be a full ARN, not a bare parameter name: it is used verbatim as an IAM policy
    # Resource below, and a bare name there is not a valid ARN. Fail at the parameter rather
    # than mid-deploy with a CloudFormation MalformedPolicyDocument.
    AllowedPattern: '^arn:aws:(ssm|secretsmanager):[a-z0-9-]+:\d{12}:.+'
    Description: >
      ARN of the SSM SecureString parameter (or Secrets Manager secret) holding the Stripe
      secret key. The key itself is NEVER passed to CloudFormation — it is fetched by the
      function at cold start. Storing it as a plaintext Lambda environment variable exposes
      it to anyone with lambda:GetFunctionConfiguration.

  AllowedOrigin:
    Type: String
    AllowedPattern: '^https?://.+'
    Description: >
      Comma-separated allowlist of origins permitted to call this API, e.g.
        https://shop.passion.graphics
        https://staging.shop.passion.graphics,https://shop.passion.graphics
      The first entry is also used as the site base URL for Stripe's success/cancel redirects.

      Deliberately has NO default. A wildcard default meant an unset CI secret silently
      shipped `*` to production, handing any website a free Stripe-session-minting endpoint.
      An unset value now fails the deploy.

# ─────────────────────────────────────────────
# Globals — applied to all Lambda functions
# arm64 (Graviton2) is ~20% cheaper and
# equally fast for I/O-bound Node.js workloads.
# ─────────────────────────────────────────────
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 128
    Architectures: [arm64]

# ─────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────
Resources:

  # HTTP API (API Gateway v2) — cheaper than REST API,
  # built-in CORS support, $default stage = no path prefix.
  CheckoutApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # No CorsConfiguration here — CORS is owned by the function, which answers OPTIONS itself
      # (see the Preflight event below). Two reasons, both learned the hard way:
      #
      # 1. SAM mangles it. `AllowOrigins: !Split [',', !Ref AllowedOrigin]` transformed into
      #    `"x-amazon-apigateway-cors": {"Fn::Split": [...]}` — the AllowOrigins value promoted
      #    to be the entire cors object, with AllowHeaders, AllowMethods and MaxAge dropped.
      #    API Gateway accepted that and configured no CORS at all, so OPTIONS returned 404 and
      #    every browser preflight failed. curl-based POSTs kept working, which hid it.
      # 2. When HTTP API CORS *is* configured, API Gateway overwrites whatever CORS headers the
      #    function returns. That would silently replace corsHeaders() — which allowlists per
      #    origin, sets Vary: Origin, and returns no ACAO at all for a disallowed origin — with
      #    a static list. The function's version is the one covered by tests.
      # Throttling — this endpoint is unauthenticated by necessity (it runs before checkout),
      # so a rate ceiling is the only thing bounding abuse of the Stripe key.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # Lambda function — creates Stripe Checkout Sessions.
  # CodeUri is relative to this template file's directory (infra/).
  # ../lambda/create-checkout/ → resolves to lambda/create-checkout/ at repo root.
  # `yarn sync:catalog` must run before `sam build` so products.json is bundled.
  CheckoutFunction:
    Type: AWS::Serverless::Function
    # Build through lambda/create-checkout/Makefile instead of SAM's built-in Node.js builder,
    # which runs `npm install` and cannot be pointed at yarn. See that Makefile for details.
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../lambda/create-checkout/
      Handler: index.handler
      Description: Creates Stripe Checkout Sessions from cart data.
      Tags:
        Project: shop-passion-graphics
        Stage: !Ref Stage
      Environment:
        Variables:
          # Only the ARN travels through CloudFormation — never the key itself.
          STRIPE_SECRET_ARN: !Ref StripeSecretArn
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        # A raw statement, not SAM's SSMParameterWithSlashPrefixReadPolicy. That template takes a
        # parameter *name* and builds the ARN itself by concatenation —
        #   Fn::Sub "arn:${Partition}:ssm:${Region}:${AccountId}:parameter${ParameterName}"
        # — so handing it the ARN this stack already has produced a doubled, malformed resource
        # ("…:parameterarn:aws:ssm:…") that matches nothing. The deploy still succeeded; the
        # function then failed at cold start with AccessDenied on GetParameter, i.e. every
        # checkout returned 500. It also granted ssm:DescribeParameters on '*', which the
        # handler never calls.
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Ref StripeSecretArn
            - Effect: Allow
              Action: kms:Decrypt
              Resource: '*'
              Condition:
                StringEquals:
                  'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'
      Events:
        CreateCheckout:
          Type: HttpApi
          Properties:
            Path: /create-checkout
            Method: POST
            ApiId: !Ref CheckoutApi
        # Browsers preflight this request because it sends Content-Type: application/json.
        # Without an OPTIONS route the gateway answers 404 with no CORS headers and the browser
        # blocks the POST it was about to make. handleCheckout returns 204 for an allowed origin
        # and 403 for anything else; Access-Control-Max-Age keeps this to one invocation per
        # browser per day.
        Preflight:
          Type: HttpApi
          Properties:
            Path: /create-checkout
            Method: OPTIONS
            ApiId: !Ref CheckoutApi

  # Explicit log group so retention is bounded — SAM's implicit group never expires.
  CheckoutFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${CheckoutFunction}'
      RetentionInDays: 30

# ─────────────────────────────────────────────
# Outputs — the API URL is captured by deploy.yml
# and injected into the Vite build as VITE_CHECKOUT_API_URL.
# ─────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: >
      Checkout API endpoint URL.
      Baked into the Vite bundle at build time as VITE_CHECKOUT_API_URL
      by the GitHub Actions deploy workflow.
    Value: !Sub "https://${CheckoutApi}.execute-api.${AWS::Region}.amazonaws.com/create-checkout"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"
