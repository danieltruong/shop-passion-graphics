# Netlify configuration for shop.passion.graphics
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Vite build output
  command   = "yarn build"
  publish   = "dist"
  # Serverless functions directory
  functions = "netlify/functions"

[dev]
  framework  = "vite"
  command    = "vite"
  targetPort = 5173
  port       = 8888
  autoLaunch = false

