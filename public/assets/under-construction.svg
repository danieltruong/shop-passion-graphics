<svg xmlns="http://www.w3.org/2000/svg" width="200" height="30" viewBox="0 0 200 30">
  <defs>
    <linearGradient id="constructGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffff00"/>
      <stop offset="50%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#ffff00"/>
    </linearGradient>
    <pattern id="hazard" patternUnits="userSpaceOnUse" width="20" height="30">
      <rect width="20" height="30" fill="#ffff00"/>
      <polygon points="0,0 10,0 20,30 10,30" fill="#000"/>
    </pattern>
  </defs>
  <rect width="200" height="30" fill="url(#hazard)"/>
  <rect x="30" y="5" width="140" height="20" fill="#000" rx="2"/>
  <text x="100" y="20" font-family="Impact, sans-serif" font-size="12" fill="#ffff00" text-anchor="middle" letter-spacing="2">UNDER CONSTRUCTION</text>
</svg>
